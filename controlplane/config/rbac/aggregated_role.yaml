# Grants full read/write access to ChalkosControlPlane and ChalkosControlPlaneTemplate, labelled
# so the Cluster API core and control-plane managers' aggregated roles pick it up: the canonical
# way a control-plane provider's contract docs ask for RBAC on its own API group.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: chalkos-control-plane
  labels:
    cluster.x-k8s.io/aggregate-to-manager: "true"
rules:
- apiGroups:
  - controlplane.cluster.x-k8s.io
  resources:
  - chalkoscontrolplanes
  - chalkoscontrolplanetemplates
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
