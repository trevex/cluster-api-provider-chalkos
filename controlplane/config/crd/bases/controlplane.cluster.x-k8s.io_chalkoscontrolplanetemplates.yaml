                        description: Kubeconfig says how the cluster's kubeconfig
                          Secret's certificate is issued.
                        properties:
                          ttlSeconds:
                            default: 86400
                            description: |-
                              TTLSeconds is how long, in seconds, the kubeconfig Secret's client certificate is valid.
                              The certificate is issued again once two thirds of the TTL have passed.
                            format: int32
                            minimum: 600
                            type: integer
                        type: object
                      machineTemplate:
                        description: |-
                          MachineTemplate is what the control planes' Machines are made from, without the
                          infrastructure reference that a ClusterClass's topology computes for each Cluster.
                        minProperties: 1
                        properties:
                          metadata:
                            description: ObjectMeta is the metadata the control planes'
                              Machines start with.
                            minProperties: 1
                            properties:
                              annotations:
                                additionalProperties:
                                  type: string
                                description: |-
                                  annotations is an unstructured key value map stored with a resource that may be
                                  set by external tools to store and retrieve arbitrary metadata. They are not
                                  queryable and should be preserved when modifying objects.
                                  More info: http://kubernetes.io/docs/user-guide/annotations
                                type: object
                              labels:
