              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of ChalkosControlPlaneTemplate.
            properties:
              template:
                description: Template is the ChalkosControlPlane a ClusterClass's
                  control plane is instantiated from.
                minProperties: 1
                properties:
                  metadata:
                    description: ObjectMeta is the metadata the instantiated ChalkosControlPlane
                      starts with.
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
