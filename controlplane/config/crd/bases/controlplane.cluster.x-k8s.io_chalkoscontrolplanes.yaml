---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.23.0
  name: chalkoscontrolplanes.controlplane.cluster.x-k8s.io
spec:
  group: controlplane.cluster.x-k8s.io
  names:
    categories:
    - cluster-api
    kind: ChalkosControlPlane
    listKind: ChalkosControlPlaneList
    plural: chalkoscontrolplanes
    singular: chalkoscontrolplane
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - description: Cluster
      jsonPath: .metadata.labels['cluster\.x-k8s\.io/cluster-name']
      name: Cluster
      type: string
    - description: The control plane passes all availability checks
      jsonPath: .status.conditions[?(@.type=="Available")].status
      name: Available
      type: string
    - description: The desired number of control planes
      jsonPath: .spec.replicas
      name: Desired
      type: integer
    - description: The number of control planes
      jsonPath: .status.replicas
      name: Replicas
      type: integer
    - description: The number of control planes with the Ready condition true
      jsonPath: .status.readyReplicas
      name: Ready
      type: integer
    - description: The control plane can accept requests
      jsonPath: .status.initialization.controlPlaneInitialized
      name: Initialized
      type: boolean
    - description: Reconciliation paused
      jsonPath: .status.conditions[?(@.type=="Paused")].status
      name: Paused
      priority: 10
      type: string
    - description: Time since creation of ChalkosControlPlane
      jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - description: The Kubernetes version of the control plane
      jsonPath: .spec.version
      name: Version
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          ChalkosControlPlane is the control-plane provider's contribution to a Cluster: the chalkos
          image and documents its control-plane Machines install, and how many of them there are.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: Spec is the desired state of ChalkosControlPlane.
            properties:
              files:
                description: |-
                  Files are the cluster-wide chalkos config documents every node of the cluster gets (such as
                  Flannel, Addon and Registry documents), together with the control planes' own Node fields.
                  They must hold the Cluster document, which names the etcd, coredns, pause and flannel images;
                  the controllers derive the API server's, controller-manager's, scheduler's and kube-proxy's
                  from the version where it names none. Fields the controllers own are refused: the Node's type
                  and providerID, the Cluster's endpoint, and its ipFamilies, podCIDRs and serviceCIDRs when the
                  Cluster's clusterNetwork gives ranges. The cluster-wide documents other than Secrets are also
                  recorded in status.observedFiles, so very large files count about twice against the
                  object's size limit.
                items:
                  type: object
                  x-kubernetes-preserve-unknown-fields: true
                maxItems: 256
                type: array
                x-kubernetes-preserve-unknown-fields: true
              image:
                description: 'Image is the chalkos image the control planes install,
                  by digest: repository@sha256:….'
                pattern: ^.+@sha256:[a-f0-9]{64}$
                type: string
              imagePullSecretRef:
                description: |-
                  ImagePullSecretRef names a Secret of type kubernetes.io/dockerconfigjson in the
                  ChalkosControlPlane's namespace whose credentials the controller reads the image with. The
                  node pulls with the Registry documents among Files.
                properties:
                  name:
                    default: ""
                    description: |-
                      Name of the referent.
                      This field is effectively required, but due to backwards compatibility is
                      allowed to be empty. Instances of this type with an empty value here are
                      almost certainly wrong.
                      More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                    type: string
                type: object
                x-kubernetes-map-type: atomic
              kubeconfig:
                default: {}
                description: Kubeconfig says how the cluster's kubeconfig Secret's
                  certificate is issued.
                properties:
                  ttlSeconds:
                    default: 86400
                    description: |-
                      TTLSeconds is how long, in seconds, the kubeconfig Secret's client certificate is valid.
                      The certificate is issued again once two thirds of the TTL have passed.
                    format: int32
                    minimum: 600
                    type: integer
                type: object
              machineTemplate:
                description: MachineTemplate is what the control planes' Machines
                  are made from.
                properties:
                  metadata:
                    description: ObjectMeta is the metadata the control planes' Machines
                      start with.
                    minProperties: 1
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          annotations is an unstructured key value map stored with a resource that may be
                          set by external tools to store and retrieve arbitrary metadata. They are not
                          queryable and should be preserved when modifying objects.
                          More info: http://kubernetes.io/docs/user-guide/annotations
                        type: object
                      labels:
                        additionalProperties:
                          type: string
                        description: |-
                          labels is a map of string keys and values that can be used to organize and categorize
                          (scope and select) objects. May match selectors of replication controllers
                          and services.
                          More info: http://kubernetes.io/docs/user-guide/labels
                        type: object
                    type: object
                  spec:
                    description: Spec is the control planes' Machines' spec.
                    properties:
                      deletion:
                        description: Deletion contains configuration options for a
                          control plane's Machine's deletion.
                        minProperties: 1
                        properties:
                          nodeDeletionTimeoutSeconds:
                            description: |-
                              NodeDeletionTimeoutSeconds is how long the controller attempts to delete a control plane
                              Machine's Node, measured from when that deletion started. A value of 0 retries
                              indefinitely.
                            format: int32
                            minimum: 0
                            type: integer
                          nodeDrainTimeoutSeconds:
                            description: |-
                              NodeDrainTimeoutSeconds is the total amount of time the controller spends draining a
                              control plane's node. Its default, 0, means the node is drained without a time limit.
                            format: int32
                            minimum: 0
                            type: integer
                          nodeVolumeDetachTimeoutSeconds:
                            description: |-
                              NodeVolumeDetachTimeoutSeconds is the total amount of time the controller waits for all of
                              a control plane's volumes to detach. Its default, 0, means it waits without a time limit.
                            format: int32
                            minimum: 0
                            type: integer
                        type: object
                      infrastructureRef:
                        description: |-
                          InfrastructureRef is a required reference to the infrastructure resource backing each
                          control plane's Machine, offered by an infrastructure provider.
                        properties:
                          apiGroup:
                            description: |-
                              apiGroup is the group of the resource being referenced.
                              apiGroup must be fully qualified domain name.
                              The corresponding version for this reference will be looked up from the contract
                              labels of the corresponding CRD of the resource being referenced.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                          kind:
                            description: |-
                              kind of the resource being referenced.
                              kind must consist of alphanumeric characters or '-', start with an alphabetic character, and end with an alphanumeric character.
                            maxLength: 63
                            minLength: 1
                            pattern: ^[a-zA-Z]([-a-zA-Z0-9]*[a-zA-Z0-9])?$
                            type: string
                          name:
                            description: |-
                              name of the resource being referenced.
                              name must consist of lower case alphanumeric characters, '-' or '.', and must start and end with an alphanumeric character.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - apiGroup
                        - kind
                        - name
                        type: object
                    required:
                    - infrastructureRef
                    type: object
                required:
                - spec
                type: object
              replicas:
                default: 1
                description: |-
                  Replicas is the number of control planes to run. It must be odd, so the control plane's
                  etcd can form a quorum: an even count tolerates no more failures than the odd count below
                  it, while using one more Machine. It defaults to 1.
                format: int32
                minimum: 1
                type: integer
                x-kubernetes-validations:
                - message: replicas must be odd
                  rule: self % 2 == 1
              rollout:
                description: |-
                  Rollout says when the control planes' Machines are replaced and how. A Machine is replaced
                  when the version, image, files or infrastructure template it was made from changed, or it
                  was created before rollout.after.
                properties:
                  after:
                    description: |-
                      After replaces every control-plane Machine created before it, once it has passed, even when
                      nothing else changed. Written in RFC 3339, such as 2026-11-28T09:00:00Z.
                    format: date-time
                    type: string
                  strategy:
                    description: Strategy says how a Machine that is not up to date
                      is replaced.
                    properties:
                      rollingUpdate:
                        description: RollingUpdate replaces the Machines one at a
                          time, the oldest first.
                        properties:
                          maxSurge:
                            description: |-
                              MaxSurge is how many Machines above replicas the control plane runs while it replaces one.
                              1, the default, creates the replacement first and deletes the old Machine once the new one
                              has joined etcd. 0 deletes the old Machine first and creates the replacement once it is
                              gone, which needs at least three replicas.
                            format: int32
                            maximum: 1
                            minimum: 0
                            type: integer
                        type: object
                    type: object
                type: object
              version:
                description: |-
                  Version is the Kubernetes version the control planes run. The chalkos image they install
                  must carry a kubelet of this same release.
                maxLength: 256
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: version must start with v
                  rule: self.startsWith('v')
            required:
            - image
            - machineTemplate
            - version
            type: object
            x-kubernetes-validations:
            - message: 'rollout.strategy.rollingUpdate.maxSurge 0 needs at least 3
                replicas: with fewer, removing a control plane first loses etcd''s
                quorum'
              rule: self.?rollout.?strategy.?rollingUpdate.?maxSurge.orValue(1) ==
                1 || self.?replicas.orValue(1) >= 3
          status:
            description: Status is the observed state of ChalkosControlPlane.
            properties:
              availableReplicas:
                description: AvailableReplicas is the number of those Machines whose
                  Available condition is true.
                format: int32
                type: integer
              bootstrappedMachine:
                description: |-
                  BootstrappedMachine is the control-plane Machine that Bootstrap was called on, recorded
                  before the call so that a retry after a crash does not call Bootstrap on a second Machine.
                type: string
              conditions:
                description: |-
                  Conditions are the ChalkosControlPlane's current observations. Known condition types are
                  Available, Initialized, MachinesReady, ScalingUp, ScalingDown, RollingOut, Deleting and
                  Paused.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                maxItems: 32
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              initialization:
                description: |-
                  Initialization reports the control plane's initialization, as the Cluster API contract
                  reads it.
                minProperties: 1
                properties:
                  controlPlaneInitialized:
                    description: |-
                      ControlPlaneInitialized is true once the first control plane's Machine has applied the
                      cluster's add-ons and the control plane can accept requests.
                    type: boolean
                type: object
              kubeconfigExpiresAt:
                description: KubeconfigExpiresAt is when the kubeconfig Secret's client
                  certificate expires.
                format: date-time
                type: string
              lastRevokedPruneTime:
                description: |-
                  LastRevokedPruneTime is when the controller last asked a control plane to drop the revoked
                  nodes nothing lets back in, whether or not that succeeded. It asks after each revocation
                  of a control plane's node and otherwise once a day, which also prunes the workers'
                  revocations.
                format: date-time
                type: string
              observedFiles:
                description: |-
                  ObservedFiles are the cluster-wide documents the control plane's Machines were made from,
                  as a control-plane Machine installs them: spec.files with the fields the controllers fill
                  from the Cluster, the Cluster document's endpoint, ipFamilies, podCIDRs and serviceCIDRs,
                  but without a Machine's own Node document and without Secret documents, and with the
                  image's defaults written out, so that an image defaulting a field every node holds alike
                  differently shows as a change. They are one YAML stream of JSON documents separated by ---,
                  recorded once a Machine exists and none is out of date or being deleted. While the
                  documents a new Machine would get differ from them, the controllers compare the two for
                  changes to fields every node of the cluster holds alike, which hold every new Machine.
                type: string
              observedGeneration:
                description: ObservedGeneration is the generation the status describes.
                format: int64
                minimum: 1
                type: integer
              readyReplicas:
                description: ReadyReplicas is the number of those Machines whose Ready
                  condition is true.
                format: int32
                type: integer
              replicas:
                description: Replicas is the total number of non-terminated Machines
                  targeted by this control plane.
                format: int32
                type: integer
              selector:
                description: |-
                  Selector is the label selector, in string format, that the scale subresource and tools
                  such as kubectl use to find the control planes' Machines. The string is in the same format
                  as the query-param syntax.
                type: string
              upToDateReplicas:
                description: UpToDateReplicas is the number of those Machines whose
                  UpToDate condition is true.
                format: int32
                type: integer
              version:
                description: |-
                  Version is the Kubernetes version of the control plane's Machines.

                  Deprecated: This field is deprecated and is going to be removed in a future API version.
                  Please use status.versions instead.
                maxLength: 256
                minLength: 1
                type: string
              versions:
                description: Versions is the aggregated Kubernetes versions of the
                  control plane's Machines.
                items:
                  description: StatusVersion groups version-related status information.
                  properties:
                    replicas:
                      description: replicas is the number of replicas at this version.
                      format: int32
                      minimum: 1
                      type: integer
                    version:
                      description: version is the Kubernetes version.
                      maxLength: 256
                      minLength: 1
                      type: string
                  required:
                  - version
                  type: object
                maxItems: 100
                minItems: 1
                type: array
                x-kubernetes-list-map-keys:
                - version
                x-kubernetes-list-type: map
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      scale:
        labelSelectorPath: .status.selector
        specReplicasPath: .spec.replicas
        statusReplicasPath: .status.replicas
      status: {}
