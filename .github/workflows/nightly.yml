# Runs the CI workflow on main each night, the end-to-end test included, which no push to main
# runs. A scheduled run skips CI when an earlier nightly run already passed it on main's latest
# commit, as after a night with no push; a run started by hand always runs it. A failed run opens
# the issue labelled ci-failure, or comments on the open one. Forks do not run it.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: false

permissions: {}

jobs:
  # A nightly run that passed has the job "ci / result" with the conclusion success; a run that
  # skipped CI has none, so the run that passed stays the one that counts.
  tested:
    if: github.repository == 'trevex/cluster-api-provider-chalkos'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    outputs:
      passed: ${{ steps.main.outputs.passed }}
    steps:
      - name: Look for a passed nightly run of main's latest commit
        id: main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          passed=false
          if [ "$EVENT" = schedule ]; then
            for run in $(gh run list --workflow nightly.yml --branch main --commit "$SHA" --limit 50 \
              --json databaseId --jq '.[].databaseId'); do
              result=$(gh api --paginate "repos/$GH_REPO/actions/runs/$run/jobs?per_page=100" \
                --jq '.jobs[] | select(.name == "ci / result" and .conclusion == "success") | .id')
              if [ -n "$result" ]; then
                echo "The nightly run $run already passed CI on $SHA."
                passed=true
                break
              fi
            done
          fi
          echo "passed=$passed" >>"$GITHUB_OUTPUT"

  ci:
    needs: tested
    if: needs.tested.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml
    permissions:
      actions: read
      contents: read

  # Kept apart from CI, so that issues: write stays away from the jobs that build and run code.
  report:
    needs: ci
    if: always() && needs.ci.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - name: Open or update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BODY: "The nightly run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} of ${{ github.sha }} failed."
        run: |
          number=$(gh issue list --label ci-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh issue comment "$number" --body "$BODY"
          else
            gh issue create --title "CI fails on main" --label ci-failure --body "$BODY"
          fi
