# Finishes a branch of Renovate's after each of Renovate's commits: Renovate bumps chalkos's
# release in flake.nix but leaves flake.lock alone. Against main, a change of flake.nix locks the
# chalkos input again with nix flake update chalkos, which also moves nixpkgs and go-overlay,
# since they follow chalkos's. The fix is a commit of its own, signed off by the release GitHub
# App's bot. push-signed.sh makes it again through GitHub's API with the App's token, so that
# GitHub signs it as the bot's and ci runs on the pull request; the commits of the workflow's own
# token start no workflow. A push of the bot's own, or of anyone but Renovate, runs nothing.
# Renovate still rebases a branch with the bot's commits, since its configuration ignores them.
name: renovate-fixup

on:
  push:
    branches: ["renovate/**"]

permissions: {}

jobs:
  fixup:
    if: github.repository == 'trevex/cluster-api-provider-chalkos' && !github.event.deleted && github.event.head_commit.author.email == '29139614+renovate[bot]@users.noreply.github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # A newer commit of Renovate's on the branch cancels the run of the older one. The group is
    # the job's, so that the skipped run of the bot's own push cancels nothing.
    concurrency:
      group: renovate-fixup-${{ github.ref }}
      cancel-in-progress: true
    permissions:
      # Hestia checks which cached packs GitHub has evicted. The App's token does the rest.
      actions: read
    steps:
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/nix
      # The local commit names the bot as its author and in its sign-off, which the commit GitHub
      # makes from it keeps.
      - name: Commit as the App's bot
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          SLUG: ${{ steps.app.outputs.app-slug }}
        run: |
          id=$(gh api "/users/$SLUG%5Bbot%5D" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "$id+${SLUG}[bot]@users.noreply.github.com"
      - name: Lock the chalkos input
        run: |
          if git diff --quiet origin/main...HEAD -- flake.nix; then
            echo "flake.nix is main's"
            exit 0
          fi
          nix flake update chalkos
          if ! git diff --quiet -- flake.lock; then
            release=$(sed -nE 's|^ *chalkos\.url = "github:trevex/chalkos/([^"]+)";|\1|p' flake.nix)
            git commit -s -m "build(deps): lock chalkos $release" -- flake.lock
          fi
      - name: Push the fix
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ "$(git rev-parse HEAD)" = "$GITHUB_SHA" ]; then
            echo "nothing to fix"
            exit 0
          fi
          git log --format='%h %an: %s' "$GITHUB_SHA..HEAD"
          .github/scripts/push-signed.sh "$BRANCH" "$GITHUB_SHA"
