# Releases the providers. On every push to main, release-please opens or updates the release pull
# request, as a draft, from the Conventional Commits since the last release. Once a maintainer has
# marked that pull request ready for review and merged it, release-please tags the release and
# creates its GitHub release. The same run then publishes the release from the tagged commit: it
# pushes the bootstrap and the control-plane manager's images, signs each with cosign and attests
# its provenance and its SBOM, uploads the components files that name the images by digest and
# metadata.yaml, which clusterctl installs the providers from, and the images' SBOMs, with their
# checksums, signatures and provenance, and adds the images' digests to the release notes.
#
# release-please acts with a GitHub App's token, from the secrets RELEASE_APP_ID and
# RELEASE_APP_PRIVATE_KEY, because a pull request, a label, a tag or a return to draft that the
# workflow's own token makes starts no workflow, and the release pull request must run ci. The
# publishing jobs run in this workflow for the same reason rather than on the tag.
#
# Started by hand with dry-run, the default, the workflow builds the images and the assets of the
# ref it runs on and lists them with their digests, but pushes, signs and uploads nothing; the
# assets are the run's artifact. Started by hand on main without dry-run, it does what a push does.
name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry-run:
        description: Build and list the release without publishing it
        type: boolean
        default: true

permissions: {}

jobs:
  # Only the newest push to main matters for the release pull request, so a newer run cancels
  # an older one. A merged release pull request whose run is cancelled is released by the next
  # push to main or by starting this workflow by hand without dry-run.
  release-please:
    if: github.repository == 'trevex/cluster-api-provider-chalkos' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && !inputs.dry-run))
    runs-on: ubuntu-latest
    concurrency:
      group: release-please
      cancel-in-progress: true
    timeout-minutes: 15
    permissions: {}
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - name: Check the ref and the App's secrets
        env:
          REF: ${{ github.ref }}
          APP_ID: ${{ secrets.RELEASE_APP_ID }}
          APP_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [ "$REF" != refs/heads/main ]; then
            echo "::error title=Not main::a release is made from main, not from $REF; run a dry run instead"
            exit 1
          fi
          if [ -z "$APP_ID" ] || [ -z "$APP_KEY" ]; then
            echo "::error title=No release App::set the secrets RELEASE_APP_ID and RELEASE_APP_PRIVATE_KEY to the release GitHub App's client ID and private key; CONTRIBUTING.md lists its permissions"
            exit 1
          fi
      - uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
        id: app
        with:
          client-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      # release-please-config.json and .release-please-manifest.json configure it.
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ steps.app.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # release-please opens the release pull request as a draft, but keeps a ready one ready when
      # it rebuilds it. Returning it to draft makes its CI run only the light checks until a
      # maintainer marks it ready for review, which runs every check on the rebuilt pull request.
      # gh does nothing to a pull request that is already a draft.
      - name: Return the release pull request to draft
        if: steps.release.outputs.prs_created == 'true'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          PRS: ${{ steps.release.outputs.prs }}
        run: |
          for number in $(jq -r '.[].number' <<<"$PRS"); do
            gh pr ready --undo "$number"
          done

  # The commit to build, its version and tag, and whether the run publishes. The version is the
  # one .release-please-manifest.json records, which must be the tag release-please made and of a
  # release series that metadata.yaml lists.
  # Publishes start one at a time and are never cancelled; dry runs queue by ref. The lock is on
  # this job rather than the workflow, so a long publish or dry run never holds up release-please.
  plan:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.created == 'true' || (needs.release-please.result == 'skipped' && github.event_name != 'push')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: release-${{ github.event_name == 'workflow_dispatch' && inputs.dry-run && github.ref || 'publish' }}
      cancel-in-progress: false
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.plan.outputs.sha }}
      tag: ${{ steps.plan.outputs.tag }}
      publish: ${{ steps.plan.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.sha || github.sha }}
          persist-credentials: false
      - name: Find the version
        id: plan
        env:
          CREATED: ${{ needs.release-please.outputs.created }}
          RELEASE_TAG: ${{ needs.release-please.outputs.tag }}
        run: |
          .github/scripts/release-series.sh
          version=$(jq -r '."."' .release-please-manifest.json)
          if [ "$version" = 0.0.0 ]; then
            version=$(jq -r '."initial-version"' release-please-config.json)
          fi
          tag="v$version"
          if [ "$CREATED" = true ]; then
            publish=true
            if [ "$tag" != "$RELEASE_TAG" ]; then
              echo "::error title=Wrong tag::.release-please-manifest.json records $tag, but release-please tagged $RELEASE_TAG"
              exit 1
            fi
          else
            publish=false
          fi
          echo "Release $tag of $(git rev-parse HEAD), publish: $publish" >>"$GITHUB_STEP_SUMMARY"
          {
            echo "sha=$(git rev-parse HEAD)"
            echo "tag=$tag"
            echo "publish=$publish"
          } >>"$GITHUB_OUTPUT"

  # Builds a manager's image as an OCI layout and, when the run publishes, pushes it in the same
  # build, so the layout's digest is the pushed one. Writes the image's SBOM from the layout and,
  # when the run publishes, signs the digest and attests its provenance and its SBOM in the
  # registry.
  image:
    needs: plan
    if: ${{ !cancelled() && needs.plan.result == 'success' }}
    name: image ${{ matrix.package }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        package: [bootstrap, controlplane]
    env:
      NAME: cluster-api-provider-chalkos-${{ matrix.package }}
      REPOSITORY: ghcr.io/${{ github.repository }}-${{ matrix.package }}
      TAG: ${{ needs.plan.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the registry
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: docker login ghcr.io --username "$ACTOR" --password-stdin <<<"$GH_TOKEN"
      # The release build reads the layers that ci's build job cached on main and writes none.
      # buildx's own provenance and SBOM stay out of the image, whose digest then names a single
      # manifest; the steps below attest both.
      - name: Build the image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          build-args: package=${{ matrix.package }}
          tags: ${{ env.REPOSITORY }}:${{ env.TAG }}
          labels: |
            org.opencontainers.image.title=${{ env.NAME }}
            org.opencontainers.image.description=The chalkos Cluster API ${{ matrix.package }} provider's manager
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ needs.plan.outputs.sha }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
          outputs: type=oci,dest=oci,tar=false
          push: ${{ needs.plan.outputs.publish == 'true' }}
          provenance: false
          sbom: false
          cache-from: type=gha,scope=${{ matrix.package }}
      - name: Record the digest
        id: digest
        env:
          PACKAGE: ${{ matrix.package }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          layout=$(jq -r '.manifests[0].digest' oci/index.json)
          if [ "$DIGEST" != "$layout" ]; then
            echo "::error title=Wrong digest::buildx built $DIGEST, but the OCI layout holds $layout"
            exit 1
          fi
          mkdir image
          jq -n --arg package "$PACKAGE" --arg name "$NAME" --arg repository "$REPOSITORY" --arg tag "$TAG" --arg digest "$DIGEST" \
            '{$package, $name, $repository, $tag, $digest}' >"image/$PACKAGE.json"
          echo "digest=$DIGEST" >>"$GITHUB_OUTPUT"
          echo "- \`$REPOSITORY:$TAG@$DIGEST\`" >>"$GITHUB_STEP_SUMMARY"
      # The image's SBOM, which lists the Go modules of the manager and the packages of its base
      # image.
      - uses: anchore/sbom-action@dfcb83b97731532d72be422cbc51ee64adb6fd56 # v0.24.4
        with:
          image: oci-dir:oci
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Keep the SBOM
        run: |
          mkdir sbom
          cp sbom.spdx.json "sbom/$NAME.spdx.json"
          jq -r '"  SBOM: \(.packages | length) packages, \([.packages[] | select(.licenseDeclared != null and .licenseDeclared != "NOASSERTION")] | length) with a licence"' \
            sbom.spdx.json >>"$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.plan.outputs.publish == 'true'
      - name: Sign the image
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign sign --yes "$REPOSITORY@$DIGEST"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.plan.outputs.publish == 'true'
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          push-to-registry: true
          # Storage records are for organisations' repositories.
          create-storage-record: false
      # The SBOM as two attestations in the registry: cosign's, which cosign verify-attestation
      # --type spdxjson finds, and GitHub's, which gh attestation verify finds.
      - name: Attest the SBOM with cosign
        if: needs.plan.outputs.publish == 'true'
        env:
          DIGEST: ${{ steps.digest.outputs.digest }}
        run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "$REPOSITORY@$DIGEST"
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        if: needs.plan.outputs.publish == 'true'
        with:
          subject-name: ${{ env.REPOSITORY }}
          subject-digest: ${{ steps.digest.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.package }}
          path: image/
          retention-days: 7
      # The assets job publishes the SBOM as a release asset too.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ matrix.package }}
          path: sbom/
          retention-days: 7

  # Builds the components files, which name the images by digest, as the release's assets, with
  # metadata.yaml, the images' SBOMs and their checksums, and, when the run publishes, signs them,
  # attests their provenance and uploads them to the release.
  assets:
    needs: [plan, image]
    if: ${{ !cancelled() && needs.plan.result == 'success' && needs.image.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      # gh release upload.
      contents: write
      # Hestia checks which cached packs GitHub has evicted.
      actions: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: ./.github/actions/nix
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      # The images' SBOMs, <image>.spdx.json.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: sbom-*
          path: assets
          merge-multiple: true
      # bootstrap-components.yaml and control-plane-components.yaml, with each manager's image as
      # repository:tag@digest, and metadata.yaml: the files clusterctl reads from a release.
      - name: Build the assets
        run: |
          ref() { jq -r '"\(.repository):\(.tag)@\(.digest)"' "images/$1.json"; }
          bootstrap=$(ref bootstrap)
          controlplane=$(ref controlplane)
          nix develop .#ci --command make release-manifests RELEASE_DIR=assets \
            IMG_BOOTSTRAP="$bootstrap" IMG_CONTROLPLANE="$controlplane"
          for check in "bootstrap-components.yaml $bootstrap" "control-plane-components.yaml $controlplane"; do
            read -r file image <<<"$check"
            if ! grep -qF "image: $image" "assets/$file"; then
              echo "::error title=Wrong image::$file does not name $image"
              exit 1
            fi
          done
          chmod 0644 assets/*
          (cd assets && sha256sum -- * >SHA256SUMS)
          {
            echo '| Asset | Size |'
            echo '| --- | --- |'
            for asset in assets/*; do
              echo "| \`${asset#assets/}\` | $(du -h --apparent-size "$asset" | cut -f1) |"
            done
            echo
            echo '```text'
            cat assets/SHA256SUMS
            echo '```'
          } >>"$GITHUB_STEP_SUMMARY"
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        if: needs.plan.outputs.publish == 'true'
      - name: Sign the assets
        if: needs.plan.outputs.publish == 'true'
        run: |
          for asset in assets/*; do
            cosign sign-blob --yes --bundle "$asset.sigstore.json" "$asset"
          done
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: needs.plan.outputs.publish == 'true'
        with:
          subject-checksums: assets/SHA256SUMS
      - name: Upload the assets to the release
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: gh release upload "$TAG" assets/* --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.plan.outputs.publish != 'true'
        with:
          name: release-assets
          path: assets/
          retention-days: 7

  # Lists the images by digest with how to install and verify the release, in the run's summary
  # and, when the run publishes, at the end of the release's notes.
  notes:
    needs: [plan, image, assets]
    if: ${{ !cancelled() && needs.image.result == 'success' && needs.assets.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: images
          merge-multiple: true
      - name: Write the section on the images
        env:
          TAG: ${{ needs.plan.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
          SERVER: ${{ github.server_url }}
        run: |
          identity="$SERVER/$REPOSITORY/.github/workflows/release.yml@refs/heads/main"
          first=$(jq -r '"\(.repository)@\(.digest)"' images/bootstrap.json)
          first_name=$(jq -r .name images/bootstrap.json)
          {
            echo '<!-- cluster-api-provider-chalkos release images -->'
            echo '## Install'
            echo
            echo "With the providers in clusterctl's configuration, as the [README]($SERVER/$REPOSITORY#install) shows:"
            echo
            echo '```sh'
            echo "clusterctl init --bootstrap chalkos:$TAG --control-plane chalkos:$TAG --infrastructure <provider>"
            echo '```'
            echo
            echo '## Images'
            echo
            echo 'The components files name the managers by digest:'
            echo
            echo '```text'
            jq -rs 'sort_by(.package) | .[] | "\(.repository):\(.tag)@\(.digest)"' images/*.json
            echo '```'
            echo
            echo '## Verify'
            echo
            echo 'Each image and asset is signed with cosign by this workflow and has a provenance attestation:'
            echo
            echo '```sh'
            echo "cosign verify $first \\"
            echo "  --certificate-identity $identity \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            echo "cosign verify-blob bootstrap-components.yaml --bundle bootstrap-components.yaml.sigstore.json \\"
            echo "  --certificate-identity $identity \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com'
            echo "gh attestation verify oci://$first --repo $REPOSITORY"
            echo "gh attestation verify bootstrap-components.yaml --repo $REPOSITORY"
            echo "sha256sum --check --ignore-missing SHA256SUMS"
            echo '```'
            echo
            echo '## SBOMs'
            echo
            echo "Each image has an SPDX SBOM, as the asset \`<image>.spdx.json\`, such as \`$first_name.spdx.json\`, and as attestations on its digest:"
            echo
            echo '```sh'
            echo "cosign verify-attestation $first --type spdxjson \\"
            echo "  --certificate-identity $identity \\"
            echo '  --certificate-oidc-issuer https://token.actions.githubusercontent.com |'
            echo "  jq -r .payload | base64 -d | jq .predicate >sbom.spdx.json"
            echo "gh attestation verify oci://$first --repo $REPOSITORY \\"
            echo '  --predicate-type https://spdx.dev/Document/v2.3'
            echo '```'
          } >section.md
          cat section.md >>"$GITHUB_STEP_SUMMARY"
      # A run that publishes again replaces the section it added before.
      - name: Add the section to the release notes
        if: needs.plan.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
        run: |
          gh release view "$TAG" --json body --jq .body | sed '/^<!-- cluster-api-provider-chalkos release images -->$/,$d' >notes.md
          { echo; cat section.md; } >>notes.md
          gh release edit "$TAG" --notes-file notes.md
