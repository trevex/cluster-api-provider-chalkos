# The bootstrap provider's installation: its CRDs, RBAC and manager in the namespace
# bootstrap-chalkos-system.
namespace: bootstrap-chalkos-system
namePrefix: bootstrap-chalkos-

# Labels every resource of the bootstrap provider's installation with the provider label
# clusterctl uses to find and lifecycle it.
labels:
- includeSelectors: true
  pairs:
    cluster.x-k8s.io/provider: bootstrap-chalkos

resources:
- ../crd
- ../rbac
- ../manager
#+kubebuilder:scaffold:defaultresource
